services:
  - type: web
    name: payflow-backend
    env: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://payflow-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: payflow-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://payflow-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: payflow-db
    databaseName: payflow
    user: payflow_user
